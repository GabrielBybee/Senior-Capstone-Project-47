name: CI

# Every job runs check.py, so CI checks exactly what `python3 check.py` checks locally.
on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, runner]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock
      - run: python3 check.py ${{ matrix.service }}

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: python3 check.py frontend

  repo:
    name: repo (secrets, shellcheck, hadolint, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: python3 check.py repo

  sandbox:
    name: sandbox smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 check.py sandbox

  images:
    name: images (build + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 check.py images
