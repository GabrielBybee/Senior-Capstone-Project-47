# Weekly dependency update PRs, opened against the test branch.
# Minor and patch updates are grouped into one PR per ecosystem.
# Runtime and base-image versions (Python, Node, nginx, Ubuntu) are upgraded on
# purpose, everywhere at once, so Dependabot doesn't propose those bumps.
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/backend", "/runner"]
    target-branch: test
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: test
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Node version we run (frontend/.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/backend", "/runner", "/frontend", "/sandbox"]
    target-branch: test
    schedule:
      interval: weekly
    ignore:
      # Python version must match .python-version and CI.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node version must match frontend/.nvmrc and CI.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # We stay on nginx's stable line; odd minor versions are experimental "mainline".
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
      # A new Ubuntu release changes the compiler and sanitizer packages, and
      # interim releases (24.10, 25.04, ...) count as minor bumps, so block both.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: weekly
